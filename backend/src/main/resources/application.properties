spring.application.name=pilates-management
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pilates_studio?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:pilates_app}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS10aGF0LW11c3QtYmUtcmVwbGFjZWQ=}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
app.business.cancellation-hours=${CANCELLATION_HOURS:12}
app.business.present-session-cost=1
app.business.absent-session-cost=1
app.business.excused-session-cost=0
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
